<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagamento em análise — Brasa Burger Co.</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body data-theme="dark" style="display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; background:var(--bg,#151109);">
  <div style="max-width:440px; width:92vw; background:var(--lm-bg,#fff8ef); color:var(--lm-text,#221a10); border-radius:20px; padding:36px 28px; text-align:center;">
    <div style="font-size:2.6rem; margin-bottom:8px;">⏳</div>
    <h1 style="font-size:1.5rem; margin:0 0 6px;">Pagamento em análise</h1>
    <p id="orderInfo" style="color:var(--lm-text-2,#6b5c47); margin:0 0 20px;">O Mercado Pago está analisando esse pagamento — pode levar alguns minutos. Você não precisa fazer nada, assim que aprovar a loja já recebe o pedido automaticamente.</p>
    <a href="index.html" style="display:inline-block; background:var(--primary,#f4790a); color:#1a1206; font-weight:700; padding:12px 28px; border-radius:999px; text-decoration:none;">Voltar para o site</a>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const orderNumber = params.get('order');
    if (orderNumber) {
      document.getElementById('orderInfo').textContent =
        `Pedido ${orderNumber}: o Mercado Pago está analisando o pagamento. Pode levar alguns minutos — assim que aprovar, a loja recebe o pedido automaticamente.`;
    }
  </script>
</body>
</html>
